name: kubling-oracle-local

services:
  database:
    image: container-registry.oracle.com/database/free:23.26.3.0-lite
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-KublingLocal_2026}
    volumes:
      - ./setup:/opt/oracle/scripts/startup:ro
      - ./healthcheck.sh:/opt/oracle/kubling-healthcheck.sh:ro
    ports:
      - "127.0.0.1:1521:1521"
    healthcheck:
      test: ["CMD", "bash", "/opt/oracle/kubling-healthcheck.sh"]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 2m
    stop_grace_period: 2m

  provider:
    image: kubling-oracle-provider:local
    pull_policy: build
    build:
      context: ../../..
      dockerfile: providers/oracle/Dockerfile
    environment:
      KUBLING_ORACLE_JDBC_URL: jdbc:oracle:thin:@//database:1521/FREEPDB1
      KUBLING_ORACLE_USERNAME: kubling
      KUBLING_ORACLE_PASSWORD: KublingProvider_2026
      KUBLING_ORACLE_SCHEMA_ALLOWLIST: KUBLING
      KUBLING_ORACLE_RESOURCE_MANAGER_ID: oracle-local
      KUBLING_ORACLE_LOG_LEVEL: ${KUBLING_ORACLE_LOG_LEVEL:-INFO}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:50051:50051"
    stop_grace_period: 15s
