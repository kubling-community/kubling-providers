name: kubling-object-storage-local

services:
  minio:
    image: kubling-object-storage-minio:local
    pull_policy: build
    build:
      context: .
      dockerfile: minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kubling-local
      MINIO_ROOT_PASSWORD: kubling-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
      - --disableTelemetry
    env_file:
      - azure-fixture.env
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:10000/kublinglocal?comp=list').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - azure-data:/data

  fake-gcs:
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    command:
      - -scheme
      - http
      - -port
      - "4443"
      - -backend
      - filesystem
      - -filesystem-root
      - /data
      - -public-host
      - 127.0.0.1:4443
    ports:
      - "127.0.0.1:4443:4443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4443/storage/v1/b"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - gcs-data:/data

volumes:
  data:
  azure-data:
  gcs-data:
