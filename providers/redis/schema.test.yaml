# Equivalent Redis Hash schema for the invoices Kubling DDL.
tables:
  - name: invoices
    structure: hash
    keyPrefix: "invoices:"
    updatable: true
    key:
      name: id
      type: LONG
      updatable: true
    fields:
      - name: customer_id
        type: LONG
        nullable: false
        updatable: true
      - name: issued_at
        type: TIMESTAMP
        nullable: true
        updatable: true
      - name: total_amount
        type: BIGDECIMAL
        nullable: false
        updatable: true
      - name: status
        type: STRING
        nullable: true
        updatable: true

  - name: invoice_items
    structure: hash
    keyPrefix: "invoice_items:"
    updatable: true
    key:
      name: id
      type: LONG
    fields:
      - name: invoice_id
        type: LONG
        nullable: false
        updatable: true
      - name: product_id
        type: LONG
        nullable: false
        updatable: true
      - name: quantity
        type: INTEGER
        nullable: false
        updatable: true
      - name: unit_price
        type: BIGDECIMAL
        nullable: false
        updatable: true

  - name: payments
    structure: hash
    keyPrefix: "payments:"
    updatable: true
    key:
      name: id
      type: LONG
    fields:
      - name: invoice_id
        type: LONG
        nullable: false
        updatable: true
      - name: paid_amount
        type: BIGDECIMAL
        nullable: false
        updatable: true
      - name: paid_at
        type: TIMESTAMP
        nullable: true
        updatable: true
      - name: payment_method
        type: STRING
        nullable: false
        updatable: true