name: kubling-host-provider
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
version_schema: semver
release: "1"
section: admin
priority: optional
maintainer: Kubling contributors <kubling-community@users.noreply.github.com>
description: Dynamic host fleet provider for Kubling
homepage: https://github.com/kubling-community/kubling-providers
license: Apache-2.0

contents:
  - src: build/kubling-host-provider
    dst: /usr/bin/kubling-host-provider
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/kubling-host-provider/README.md
    file_info:
      mode: 0644
  - src: docs/deployment.md
    dst: /usr/share/doc/kubling-host-provider/docs/deployment.md
    file_info:
      mode: 0644
  - src: ../../LICENSE
    dst: /usr/share/doc/kubling-host-provider/copyright
    file_info:
      mode: 0644

deb:
  compression: xz
  fields:
    Bugs: https://github.com/kubling-community/kubling-providers/issues
