syntax = "proto3";

package kubling.provider.v1;

import "kubling/provider/v1/expression.proto";
import "kubling/provider/v1/query.proto";
import "kubling/provider/v1/tuple.proto";

option go_package = "github.com/kubling-community/kubling-providers/sdk-go/kubling/provider/v1;providerv1";
option java_multiple_files = true;
option java_outer_classname = "MutationProto";
option java_package = "com.kubling.provider.grpc";

// Inserts one or more tuples into a logical entity.
message InsertRequest {
  // Opaque identifier returned by OpenConnection.
  string connection_id = 1;

  // Logical entity into which the tuples are inserted.
  EntityReference entity = 2;

  // Tuples to insert.
  //
  // TupleBatch.fields identifies the target logical fields and their order.
  // Every tuple must contain exactly one value for each declared field.
  TupleBatch rows = 3;

  // Logical fields whose generated values should be returned.
  //
  // When empty, no generated values are requested.
  repeated string returning_fields = 4;
}

// Result of an insert operation.
message InsertResponse {
  // Number of tuples inserted.
  //
  // When absent, the provider could not determine the affected row count.
  optional uint64 affected_rows = 1;

  // Values generated by the data source.
  //
  // When present, fields must follow the order requested in returning_fields.
  // Each tuple corresponds to the inserted tuple at the same position.
  TupleBatch generated_values = 2;
}

// Updates tuples in a logical entity.
message UpdateRequest {
  // Opaque identifier returned by OpenConnection.
  string connection_id = 1;

  // Logical entity to update.
  EntityReference entity = 2;

  // Values to assign to logical fields.
  repeated Assignment assignments = 3;

  // Optional filter selecting the tuples to update.
  //
  // When absent, every tuple in the entity is selected.
  // Kubling must only include expressions supported by the provider.
  Expression filter = 4;
}

// Assignment performed by an update operation.
message Assignment {
  // Logical field to update.
  string field = 1;

  // Expression whose result is assigned to the field.
  //
  // Kubling must only send expressions supported by the provider.
  Expression value = 2;
}

// Result of an update operation.
message UpdateResponse {
  // Number of tuples updated.
  //
  // When absent, the provider could not determine the affected row count.
  optional uint64 affected_rows = 1;
}

// Deletes tuples from a logical entity.
message DeleteRequest {
  // Opaque identifier returned by OpenConnection.
  string connection_id = 1;

  // Logical entity from which tuples are deleted.
  EntityReference entity = 2;

  // Optional filter selecting the tuples to delete.
  //
  // When absent, every tuple in the entity is selected.
  // Kubling must only include expressions supported by the provider.
  Expression filter = 3;
}

// Result of a delete operation.
message DeleteResponse {
  // Number of tuples deleted.
  //
  // When absent, the provider could not determine the affected row count.
  optional uint64 affected_rows = 1;
}
