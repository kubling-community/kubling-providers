syntax = "proto3";

package kubling.provider.v1;

option go_package = "github.com/kubling-community/kubling-providers/sdk-go/kubling/provider/v1;providerv1";
option java_multiple_files = true;
option java_outer_classname = "SemanticProto";
option java_package = "com.kubling.provider.grpc";

// Requests the optional source-local semantic fragment exposed by this
// provider server. Semantic fragment retrieval is connection-agnostic.
message GetSemanticFragmentRequest {}

// Optional source-local semantic artifact exposed by the provider.
//
// An absent fragment means that the provider does not offer semantic metadata.
message GetSemanticFragmentResponse {
  SemanticFragmentArtifact fragment = 1;
}

// Self-contained, versioned kubling-semantic document.
message SemanticFragmentArtifact {
  // Exact UTF-8 document bytes.
  bytes document = 1;

  // Canonical media type. Initially application/yaml or application/json.
  string media_type = 2;

  // Exact provider-defined document version.
  string version = 3;

  // SHA-256 digest of the exact document bytes in sha256:<lowercase-hex> form.
  string digest = 4;
}
