syntax = "proto3";

package kubling.provider.v1;

option go_package = "github.com/kubling-community/kubling-providers/sdk-go/kubling/provider/v1;providerv1";
option java_multiple_files = true;
option java_outer_classname = "TransactionProto";
option java_package = "com.kubling.provider.grpc";

// Durable identity of one transaction branch owned by a provider resource
// manager.
//
// Kubling maps its coordinator-specific transaction identity to this neutral
// representation. Providers must treat branch_id as opaque binary data and
// must not assume that it is text, a UUID, or an identifier from a particular
// transaction API.
message TransactionBranchId {
  // Stable identity advertised by TransactionRecoveryCapabilities.
  string resource_manager_id = 1;

  // Opaque branch identity assigned by Kubling.
  //
  // The value must contain between 1 and 256 bytes and remains stable until the
  // branch reaches a terminal state and Kubling forgets it.
  bytes branch_id = 2;
}

// Durable state of a transaction branch.
//
// PREPARED branches and terminal outcomes must remain queryable until Kubling
// explicitly forgets them. Providers must never expire a prepared branch based
// only on elapsed time.
enum TransactionBranchState {
  TRANSACTION_BRANCH_STATE_UNSPECIFIED = 0;
  TRANSACTION_BRANCH_STATE_NOT_FOUND = 1;
  TRANSACTION_BRANCH_STATE_ACTIVE = 2;
  TRANSACTION_BRANCH_STATE_PREPARED = 3;
  TRANSACTION_BRANCH_STATE_READ_ONLY = 4;
  TRANSACTION_BRANCH_STATE_COMMITTED = 5;
  TRANSACTION_BRANCH_STATE_ROLLED_BACK = 6;
  TRANSACTION_BRANCH_STATE_HEURISTIC_COMMIT = 7;
  TRANSACTION_BRANCH_STATE_HEURISTIC_ROLLBACK = 8;
  TRANSACTION_BRANCH_STATE_HEURISTIC_MIXED = 9;
  TRANSACTION_BRANCH_STATE_HEURISTIC_HAZARD = 10;
}

// Result of durably preparing a transaction branch.
enum TransactionPrepareOutcome {
  TRANSACTION_PREPARE_OUTCOME_UNSPECIFIED = 0;
  TRANSACTION_PREPARE_OUTCOME_PREPARED = 1;
  TRANSACTION_PREPARE_OUTCOME_READ_ONLY = 2;
}

// Starts a recoverable transaction branch on an open logical connection.
message BeginTransactionBranchRequest {
  // Opaque identifier returned by OpenConnection.
  string connection_id = 1;

  // Durable identity assigned to the new branch.
  TransactionBranchId branch = 2;
}

message BeginTransactionBranchResponse {
  // ACTIVE for a newly started branch and for an idempotent repeated request
  // for the same branch on the same logical connection.
  TransactionBranchState state = 1;
}

// Durably prepares the active branch associated with a logical connection.
//
// This operation is idempotent for the same branch and logical connection. If
// the response is lost, retrying must return the original PREPARED or READ_ONLY
// outcome without applying the source mutation again.
message PrepareTransactionBranchRequest {
  // Opaque identifier returned by OpenConnection.
  string connection_id = 1;

  // Identity supplied when the branch was started.
  TransactionBranchId branch = 2;
}

message PrepareTransactionBranchResponse {
  // PREPARED when later resolution is required, or READ_ONLY when no commit or
  // rollback is necessary. Repeated requests return the original outcome.
  TransactionPrepareOutcome outcome = 1;
}

// Commits an active or prepared transaction branch.
message CommitTransactionBranchRequest {
  TransactionBranchId branch = 1;

  // Required for a one-phase commit of an active branch. A prepared branch is
  // resolved without depending on its original logical connection.
  optional string connection_id = 2;

  // True only when committing an active branch without a preceding prepare.
  bool one_phase = 3;
}

message CommitTransactionBranchResponse {
  // Terminal state observed after the operation. Repeated requests return the
  // same terminal state. A conflicting resolution request returns the retained
  // terminal state and must not change it.
  TransactionBranchState state = 1;
}

// Rolls back an active or prepared transaction branch.
message RollbackTransactionBranchRequest {
  TransactionBranchId branch = 1;

  // Required when rolling back an active branch. A prepared branch is resolved
  // without depending on its original logical connection.
  optional string connection_id = 2;
}

message RollbackTransactionBranchResponse {
  // Terminal state observed after the operation. Repeated requests return the
  // same terminal state. A conflicting resolution request returns the retained
  // terminal state and must not change it.
  TransactionBranchState state = 1;
}

// Enumerates transaction branches that still require coordinator resolution.
//
// A recovery scan includes PREPARED and heuristic branches. Normal terminal
// outcomes remain available through GetTransactionBranchStatus but are not
// returned by this operation. Each stream is a stable snapshot and returns a
// branch at most once, even if its state changes while the scan is open.
message RecoverTransactionBranchesRequest {
  // Stable identity advertised by TransactionRecoveryCapabilities.
  string resource_manager_id = 1;
}

// One batch in a stable recovery scan.
message RecoverTransactionBranchesResponse {
  repeated TransactionBranch branches = 1;
}

// Recoverable branch and its current durable state.
message TransactionBranch {
  TransactionBranchId branch = 1;
  TransactionBranchState state = 2;
}

// Reads the durable outcome of a branch after an ambiguous response or
// coordinator restart.
message GetTransactionBranchStatusRequest {
  TransactionBranchId branch = 1;
}

message GetTransactionBranchStatusResponse {
  TransactionBranchState state = 1;
}

// Releases the durable outcome record after Kubling has persisted the terminal
// result. Prepared and active branches cannot be forgotten. Repeating the
// operation after the record has already been removed succeeds.
message ForgetTransactionBranchRequest {
  TransactionBranchId branch = 1;
}

message ForgetTransactionBranchResponse {}
