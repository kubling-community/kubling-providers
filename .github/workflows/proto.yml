name: Protobuf

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.lock'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  buf:
    name: Validate and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate and publish protobuf module
        uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
