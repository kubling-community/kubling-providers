name: Kubernetes Provider

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'providers/kubernetes/v*'
    paths:
      - 'providers/kubernetes/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-kubernetes.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'providers/kubernetes/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-kubernetes.yml'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_go-module.yml
    with:
      module_name: Kubernetes provider
      module_directory: providers/kubernetes

  container:
    needs: validate
    uses: ./.github/workflows/_provider-container.yml
    with:
      provider_name: kubernetes
      provider_directory: providers/kubernetes
      image_repository: docker.io/kubling/kubernetes-provider
      image_title: Kubling Kubernetes Provider
      image_description: Kubernetes provider for Kubling
    secrets: inherit

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/providers/kubernetes/v')
    needs:
      - validate
      - container
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Kubernetes Provider ${{ needs.container.outputs.version }}"
