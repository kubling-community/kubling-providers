name: Oracle Provider

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'providers/oracle/v*'
    paths:
      - 'providers/oracle/**'
      - 'proto/**'
      - 'sdk-java/**'
      - 'buf.lock'
      - 'buf.yaml'
      - 'generate.sh'
      - 'tools/bootstrap.sh'
      - 'tools/check_java_build.sh'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-oracle.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'providers/oracle/**'
      - 'proto/**'
      - 'sdk-java/**'
      - 'buf.lock'
      - 'buf.yaml'
      - 'generate.sh'
      - 'tools/bootstrap.sh'
      - 'tools/check_java_build.sh'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-oracle.yml'

permissions:
  contents: read

env:
  KUBLING_MAVEN_VERSION: '3.9.16'
  KUBLING_MAVEN_DISTRIBUTION_SHA256: '5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce'

jobs:
  validate:
    name: Validate Java provider
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      - name: Set up pinned Maven
        run: |
          cd "${RUNNER_TEMP}"
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper \
            "-Dmaven=${KUBLING_MAVEN_VERSION}" \
            -Dtype=bin \
            "-DdistributionSha256Sum=${KUBLING_MAVEN_DISTRIBUTION_SHA256}"
          "${RUNNER_TEMP}/mvnw" --batch-mode --version
          echo "MAVEN_COMMAND=${RUNNER_TEMP}/mvnw" >> "${GITHUB_ENV}"

      - name: Validate provider release version
        if: startsWith(github.ref, 'refs/tags/providers/oracle/v')
        shell: bash
        run: |
          tagged_version="${GITHUB_REF_NAME#providers/oracle/v}"
          project_version="$("${MAVEN_COMMAND}" --quiet --no-transfer-progress \
            -f providers/oracle/pom.xml \
            help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)"
          if [[ "${project_version}" != "${tagged_version}" ]]; then
            echo "::error::Oracle provider tag version ${tagged_version} does not match pom.xml ${project_version}."
            exit 1
          fi

      - name: Generate SDK, compile and test
        run: |
          bash tools/check_java_build.sh
          "${MAVEN_COMMAND}" --batch-mode --no-transfer-progress \
            -f sdk-java/pom.xml clean install
          "${MAVEN_COMMAND}" --batch-mode --no-transfer-progress \
            -f providers/oracle/pom.xml clean verify

  container:
    needs: validate
    uses: ./.github/workflows/_provider-container.yml
    with:
      provider_name: oracle
      provider_directory: providers/oracle
      image_repository: docker.io/kubling/oracle-provider
      image_title: Kubling Oracle Provider
      image_description: Oracle Database provider for Kubling
      sdk_kind: java
    secrets: inherit
