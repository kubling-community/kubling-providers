name: Java bindings

on:
  push:
    branches: [main, master]
    tags: ['sdk-java/v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing sdk-java/vX.Y.Z tag to validate or publish'
        required: true
        type: string
      publish:
        description: 'Publish this release to Maven Central'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provider-java-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate coordinated version
        run: |
          python3 tools/check_release.py all

      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 tools/check_release.py java "${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          python3 tools/check_release.py train HEAD

      - name: Generate, compile, test and package
        run: |
          bash tools/check_java_build.sh
          mvn --batch-mode --no-transfer-progress -f sdk-java/pom.xml clean verify
          python3 tools/check_packages.py java

      - uses: actions/upload-artifact@v4
        with:
          name: java-provider-bindings
          path: sdk-java/target/*.jar
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up GraalVM and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/check_release.py java "${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          python3 tools/check_release.py train HEAD
          bash tools/check_java_build.sh
      - name: Build, sign and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -f sdk-java/pom.xml -Prelease clean deploy
