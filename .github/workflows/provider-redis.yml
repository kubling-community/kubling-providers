name: Redis Provider

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'providers/redis/v*'
    paths:
      - 'providers/redis/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-redis.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'providers/redis/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-redis.yml'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_go-module.yml
    with:
      module_name: Redis provider
      module_directory: providers/redis

  container:
    needs: validate
    uses: ./.github/workflows/_provider-container.yml
    with:
      provider_name: redis
      provider_directory: providers/redis
      image_repository: docker.io/kubling/redis-provider
      image_title: Kubling Redis Provider
      image_description: Redis provider for Kubling
    secrets: inherit

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/providers/redis/v')
    needs:
      - validate
      - container
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Redis Provider ${{ needs.container.outputs.version }}"
