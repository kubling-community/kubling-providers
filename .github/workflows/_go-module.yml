name: Go Module Validation

on:
  workflow_call:
    inputs:
      module_name:
        description: Human-readable module name
        required: true
        type: string
      module_directory:
        description: Repository-relative Go module directory
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.module_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: ${{ inputs.module_directory }}/go.sum

      - name: Verify module dependencies
        working-directory: ${{ inputs.module_directory }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        working-directory: ${{ inputs.module_directory }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ inputs.module_directory }}
        run: go test -race ./...

      - name: Build
        working-directory: ${{ inputs.module_directory }}
        run: go build ./...
