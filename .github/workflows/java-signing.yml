name: Java signing check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBLING_MAVEN_VERSION: '3.9.16'
  KUBLING_MAVEN_DISTRIBUTION_SHA256: '5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce'

concurrency:
  group: provider-java-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Set up pinned Maven
        run: |
          cd "${RUNNER_TEMP}"
          mvn --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper \
            "-Dmaven=${KUBLING_MAVEN_VERSION}" \
            -Dtype=bin \
            "-DdistributionSha256Sum=${KUBLING_MAVEN_DISTRIBUTION_SHA256}"
          "${RUNNER_TEMP}/mvnw" --batch-mode --version
          echo "MAVEN_COMMAND=${RUNNER_TEMP}/mvnw" >> "${GITHUB_ENV}"
      - name: Validate coordinated version and build JDK
        run: |
          python3 tools/check_release.py all
          bash tools/check_java_build.sh
      - name: Build, test and sign without deployment
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "${MAVEN_GPG_KEY}" || { echo 'Missing MAVEN_GPG_PRIVATE_KEY'; exit 1; }
          test -n "${MAVEN_GPG_PASSPHRASE}" || { echo 'Missing MAVEN_GPG_PASSPHRASE'; exit 1; }
          "${MAVEN_COMMAND}" --batch-mode --no-transfer-progress -f sdk-java/pom.xml -Prelease -Dgpg.useagent=false clean verify
      - name: Inspect packages and verify signatures
        run: |
          python3 tools/check_packages.py java
          python3 tools/check_java_signatures.py
