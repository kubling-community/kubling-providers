name: Cassandra Provider

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'providers/cassandra/v*'
    paths:
      - 'providers/cassandra/**'
      - 'sdk-go/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/provider-cassandra.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'providers/cassandra/**'
      - 'sdk-go/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/provider-cassandra.yml'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_go-module.yml
    with:
      module_name: Cassandra provider
      module_directory: providers/cassandra

  container:
    name: Build container image
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          release=false
          stable=false
          version=dev
          major_minor=

          if [[ "${GITHUB_REF}" == refs/tags/providers/cassandra/v* ]]; then
            tagged_version="${GITHUB_REF_NAME#providers/cassandra/}"
            if [[ ! "${tagged_version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${GITHUB_REF_NAME} is not a valid Cassandra provider semantic version tag."
              exit 1
            fi

            version="${tagged_version#v}"
            core_version="${version%%-*}"
            major_minor="${core_version%.*}"
            release=true
            if [[ "${version}" != *-* ]]; then
              stable=true
            fi
          fi

          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major_minor}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: docker.io/kubling/cassandra-provider
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=Kubling Cassandra Provider
            org.opencontainers.image.description=Apache Cassandra provider for Kubling
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish container image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: providers/cassandra/Dockerfile
          platforms: ${{ steps.version.outputs.release == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.version.outputs.release == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=provider-cassandra
          cache-to: type=gha,mode=max,scope=provider-cassandra
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/providers/cassandra/v')
    needs:
      - validate
      - container
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Cassandra Provider ${{ needs.container.outputs.version }}"
