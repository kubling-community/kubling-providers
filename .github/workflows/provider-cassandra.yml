name: Cassandra Provider

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'providers/cassandra/v*'
    paths:
      - 'providers/cassandra/**'
      - 'sdk-go/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-cassandra.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'providers/cassandra/**'
      - 'sdk-go/**'
      - '.github/workflows/_go-module.yml'
      - '.github/workflows/_provider-container.yml'
      - '.github/workflows/provider-cassandra.yml'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_go-module.yml
    with:
      module_name: Cassandra provider
      module_directory: providers/cassandra

  container:
    needs: validate
    uses: ./.github/workflows/_provider-container.yml
    with:
      provider_name: cassandra
      provider_directory: providers/cassandra
      image_repository: docker.io/kubling/cassandra-provider
      image_title: Kubling Cassandra Provider
      image_description: Apache Cassandra provider for Kubling
    secrets: inherit

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/providers/cassandra/v')
    needs:
      - validate
      - container
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Cassandra Provider ${{ needs.container.outputs.version }}"
