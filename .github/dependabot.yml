version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - /sdk-go
      - /providers/cassandra
      - /providers/inmemory
      - /providers/kubernetes
      - /providers/openapi
      - /providers/redis
      - /testing
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      go-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
