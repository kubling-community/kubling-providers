version: 2

# Routine version updates are intentionally disabled. Dependabot alerts and
# security updates are managed through the repository security settings.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directories:
      - /sdk-go
      - /providers/cassandra
      - /providers/inmemory
      - /providers/kubernetes
      - /providers/openapi
      - /providers/redis
      - /testing
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
